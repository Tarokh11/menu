name: Deploy third-idea

on:
  push:
    branches:
      - third-idea
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-third-idea
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: third-idea

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          for variable in SERVER_HOST SERVER_USER SERVER_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!variable}" ]; then
              printf 'Missing required deployment value: %s\n' "$variable" >&2
              exit 1
            fi
          done
          if ! printf '%s' "$SERVER_SSH_KEY" | grep -q 'PRIVATE KEY'; then
            printf 'SERVER_SSH_KEY must contain an OpenSSH private key, not a public key.\n' >&2
            exit 1
          fi

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          printf -v remote_path '%q' "$DEPLOY_PATH"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH=$remote_path bash -se" <<'REMOTE'
          set -eu
          cd "$DEPLOY_PATH"
          git fetch --prune origin third-idea
          git checkout -B third-idea origin/third-idea
          docker compose build web
          docker compose run --rm web python manage.py test
          docker compose up -d
          docker compose exec -T web python manage.py check --deploy
          docker compose ps
          REMOTE
