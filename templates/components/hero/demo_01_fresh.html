{% load static %}
<section class="hero hero-fresh" aria-labelledby="hero-title">
  <div class="hero-copy">
    <p class="overline"><span aria-hidden="true"></span> آبمیوه و بستنی طبیعی، هر روز تازه</p>
    <h1 id="hero-title">طعمِ تازه،<br><em>حالِ بهتر.</em></h1>
    <p class="intro">از میوه‌ی رسیده تا اولین جرعه؛ ساده، طبیعی و درست همان‌طور که دوستش داری.</p>
    <div class="hero-actions">
      <a class="primary-action" href="#menu"><span>کشف طعم‌ها</span><b aria-hidden="true">←</b></a>
      <a class="secondary-action" href="tel:+982112345678"><span aria-hidden="true">☎</span> سفارش تلفنی</a>
    </div>
    <div class="hero-proof"><span><i aria-hidden="true">✳</i> میوه‌ی تازه‌ی روز</span><span><i aria-hidden="true">✓</i> ترکیب دلخواه تو</span></div>
  </div>

  <div class="hero-visual" aria-hidden="true">
    <div class="hero-orb hero-orb-back"></div>
    <div class="hero-orb hero-orb-front"></div>
    <div class="hero-leaf hero-leaf-one"></div>
    <div class="hero-leaf hero-leaf-two"></div>
    <img class="hero-fruit hero-orange" src="{% static 'menu/demos/demo-01/images/orange.svg' %}" alt="">
    <img class="hero-fruit hero-strawberry" src="{% static 'menu/demos/demo-01/images/strawberry.svg' %}" alt="">
    <img class="hero-fruit hero-kiwi" src="{% static 'menu/demos/demo-01/images/kiwi.svg' %}" alt="">
    <div class="hero-drink-shadow"></div>
    <img class="hero-glass" src="{% static 'menu/demos/demo-01/images/glass.svg' %}" alt="">
    <div class="hero-freshness"><i aria-hidden="true">✳</i><span>ترکیب تازه‌ی امروز</span></div>
    <div class="hero-note"><strong>{{ item_count }}</strong><span>طعم طبیعی<br>برای انتخاب تو</span></div>
  </div>
</section>
