<section class="theme-toolbar" aria-label="تم رنگی صفحه">
  <span class="theme-toolbar-label">رنگ ویتای تو</span>
  <div class="theme-choices" role="group" aria-label="انتخاب رنگ">
    <button type="button" class="theme-choice" data-color-theme="blue" aria-pressed="true" style="--swatch:linear-gradient(135deg,#1947b9 0 40%,#b53c26 40% 70%,#ffd16b 70%)"><i aria-hidden="true"></i>آبی</button>
    <button type="button" class="theme-choice" data-color-theme="mint" aria-pressed="false" style="--swatch:linear-gradient(135deg,#12694e 0 40%,#7546a8 40% 70%,#d8ec93 70%)"><i aria-hidden="true"></i>نعناعی</button>
    <button type="button" class="theme-choice" data-color-theme="berry" aria-pressed="false" style="--swatch:linear-gradient(135deg,#a12b56 0 40%,#08786d 40% 70%,#ffe5a0 70%)"><i aria-hidden="true"></i>تمشکی</button>
    <button type="button" class="theme-choice" data-color-theme="violet" aria-pressed="false" style="--swatch:linear-gradient(135deg,#6940ac 0 40%,#1c6d69 40% 70%,#ffd395 70%)"><i aria-hidden="true"></i>بنفش</button>
    <button type="button" class="theme-choice" data-color-theme="citrus" aria-pressed="false" style="--swatch:linear-gradient(135deg,#aa490c 0 40%,#153c5b 40% 70%,#b8dae4 70%)"><i aria-hidden="true"></i>پرتقالی</button>
  </div>
  <span class="theme-status" role="status" aria-live="polite"></span>
</section>
