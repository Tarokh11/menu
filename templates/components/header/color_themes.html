<section class="theme-toolbar" aria-label="تم رنگی صفحه">
  <span class="theme-toolbar-label">رنگ ویتای تو</span>
  <div class="theme-choices" role="group" aria-label="انتخاب رنگ">
    <button type="button" class="theme-choice" data-color-theme="blue" aria-pressed="true" style="--swatch:#1947b9"><i aria-hidden="true"></i>آبی</button>
    <button type="button" class="theme-choice" data-color-theme="mint" aria-pressed="false" style="--swatch:#12694e"><i aria-hidden="true"></i>نعناعی</button>
    <button type="button" class="theme-choice" data-color-theme="berry" aria-pressed="false" style="--swatch:#a12b56"><i aria-hidden="true"></i>تمشکی</button>
    <button type="button" class="theme-choice" data-color-theme="violet" aria-pressed="false" style="--swatch:#6940ac"><i aria-hidden="true"></i>بنفش</button>
    <button type="button" class="theme-choice" data-color-theme="citrus" aria-pressed="false" style="--swatch:#a64b0a"><i aria-hidden="true"></i>پرتقالی</button>
  </div>
  <span class="theme-status" role="status" aria-live="polite"></span>
</section>
